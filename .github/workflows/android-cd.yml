name: FitLens CD - Release Artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example, v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Android release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Presage API key
        env:
          PRESAGE_API_KEY: ${{ secrets.PRESAGE_API_KEY }}
        run: |
          if [ -n "$PRESAGE_API_KEY" ]; then
            printf 'PRESAGE_API_KEY=%s\n' "$PRESAGE_API_KEY" > secrets.properties
          else
            echo "PRESAGE_API_KEY is unavailable; using the committed placeholder for this build."
          fi

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" || {
            echo "GOOGLE_SERVICES_JSON must be configured for release builds."
            exit 1
          }
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ANDROID_KEYSTORE_BASE64 must be configured for signed release builds."
            exit 1
          }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > fitlens-release.keystore

      - name: Verify repository invariants
        run: |
          ./scripts/verify_fitlens.sh

      - name: Build signed ARM APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/fitlens-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signed ARM APKs
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 2
          test -f app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          test -f app/build/outputs/apk/release/app-arm64-v8a-release.apk
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify "$apk"
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fitlens-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/release/*.apk \
            --title "FitLens $RELEASE_TAG" \
            --generate-notes
