name: FitLens CD - Release Artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (for example, v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Android release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Presage API key
        env:
          PRESAGE_API_KEY: ${{ secrets.PRESAGE_API_KEY }}
        run: |
          if [ -n "$PRESAGE_API_KEY" ]; then
            printf 'PRESAGE_API_KEY=%s\n' "$PRESAGE_API_KEY" > secrets.properties
          else
            echo "PRESAGE_API_KEY is unavailable; using the committed placeholder for this build."
          fi

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON" || {
            echo "GOOGLE_SERVICES_JSON must be configured for release builds."
            exit 1
          }
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Verify repository invariants
        run: |
          ./scripts/verify_fitlens.sh

      - name: Build release APK and bundle
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fitlens-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            --title "FitLens $RELEASE_TAG" \
            --generate-notes
