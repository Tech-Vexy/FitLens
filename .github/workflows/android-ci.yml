name: FitLens CI - Day 1 Hard Gate & Build Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-architecture-and-tests:
    name: Architecture, Day 1 Gate & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Secrets Committed
        run: |
          echo "Verifying secrets.properties is not tracked in Git..."
          if git ls-files --error-unmatch secrets.properties 2>/dev/null; then
            echo "ERROR: secrets.properties is tracked in Git! Failing build."
            exit 1
          fi
          echo "PASS: secrets.properties is correctly ignored."

      - name: Verify Zero AI Key in Source & Manifest
        run: |
          echo "Verifying zero GEMINI_API_KEY in source files..."
          if grep -rn "GEMINI_API_KEY" app/src/ 2>/dev/null; then
            echo "ERROR: Found GEMINI_API_KEY string in source code! Failing build."
            exit 1
          fi
          echo "PASS: Client-side AI keys completely absent (Zero AI Key Architecture)."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Presage API key
        env:
          PRESAGE_API_KEY: ${{ secrets.PRESAGE_API_KEY }}
        run: |
          if [ -n "$PRESAGE_API_KEY" ]; then
            printf 'PRESAGE_API_KEY=%s\n' "$PRESAGE_API_KEY" > secrets.properties
          else
            echo "PRESAGE_API_KEY is unavailable; using the committed placeholder for this build."
          fi

      - name: Configure Firebase (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "PASS: google-services.json written from GOOGLE_SERVICES_JSON secret."
          else
            echo "WARNING: GOOGLE_SERVICES_JSON secret not set; Firebase integration checks will be skipped."
          fi

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "ANDROID_KEYSTORE_BASE64 must be configured for signed release builds."
            exit 1
          }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fitlens-release.jks"

      - name: Run FitLens architecture verification
        run: ./scripts/verify_fitlens.sh

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Run Unit Tests (Headless Day 1 Hard Gate Suite)
        run: ./gradlew test --stacktrace

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fitlens-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signed ARM APKs
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 2
          test -f app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          test -f app/build/outputs/apk/release/app-arm64-v8a-release.apk
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify "$apk"
          done

      - name: Verify Critical Classes Survived R8 Minification
        run: |
          set -euo pipefail
          echo "Verifying critical classes are present in release DEX..."
          mkdir -p /tmp/apk_inspect
          # Inspect the arm64 APK (canonical release artifact)
          unzip -o app/build/outputs/apk/release/app-arm64-v8a-release.apk "classes*.dex" -d /tmp/apk_inspect

          shopt -s nullglob
          dex_files=(/tmp/apk_inspect/classes*.dex)
          if [ "${#dex_files[@]}" -eq 0 ]; then
            echo "ERROR: No classes*.dex files were extracted from release APK."
            exit 1
          fi

          MISSING=0
          for CLASS in \
            "com.fitlens.app.FitLensApp" \
            "com.fitlens.app.MainActivity"; do
            DESCRIPTOR="L$(echo "$CLASS" | tr '.' '/');"
            FOUND=0
            for dex_file in "${dex_files[@]}"; do
              if grep -qaF "$DESCRIPTOR" "$dex_file"; then
                FOUND=1
                break
              fi
            done
            if [ "$FOUND" -eq 1 ]; then
              echo "PASS: $CLASS found in DEX."
            else
              echo "FAIL: $CLASS is MISSING from DEX — R8 stripped it!"
              MISSING=$((MISSING + 1))
            fi
          done

          rm -rf /tmp/apk_inspect
          if [ "$MISSING" -gt 0 ]; then
            echo "ERROR: $MISSING critical class(es) missing from release APK. App will crash on startup."
            exit 1
          fi
          echo "All critical entry-point classes verified in release DEX."

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fitlens-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
